services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent   # local only: the database is not reachable from outside Docker
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    ports:
      - "127.0.0.1:8000:8000"   # only this laptop; the public link goes through the tunnel
    depends_on:
      db:
        condition: service_healthy

  # Optional public link: docker compose --profile public up
  # Cloudflare "quick tunnel": free, no account, a new https://....trycloudflare.com address each time.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
